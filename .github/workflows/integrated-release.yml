name: ShopEasy integrated release checks
on:
  push:
    branches: ['release-integration-fixes-20261127', 'vercel-preview']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  css-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --include=dev
      - run: npm run build:design-css
      - run: node scripts/build-design-css.mjs --check
      - name: Export only rebuilt public CSS and public build manifest for source recovery
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for(const path of ["public/css/design-polish.min.css","generated/design-css-manifest.json"]){const content=fs.readFileSync(path).toString("base64");const chunks=content.match(/.{1,3000}/g)||[];for(let i=0;i<chunks.length;i++)console.log("CSS_RECOVERY "+path+" "+i+"/"+chunks.length+" "+chunks[i]);}'
      - name: Require committed generated output
        run: git diff --exit-code -- public/css/design-polish.min.css public/css/design-foundation.min.css generated/design-css-manifest.json
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
      - name: Production dependency security audit
        if: ${{ always() }}
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency security audit
        if: ${{ always() }}
        run: npm audit --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: shopeasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopeasy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: local-ci-only
      SHOP_POSTGRES_TEST_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/shopeasy_ci
      SHOP_DB_BACKEND: postgres-staging
      NODE_ENV: test
      SEED_DEMO_DATA: 'false'
      STORE_CURRENCY: EUR
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: npm ci --include=dev
      - name: Prepare disposable schema
        run: |
          psql "$SHOP_POSTGRES_TEST_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA extensions; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          psql "$SHOP_POSTGRES_TEST_URL" -v ON_ERROR_STOP=1 -f postgres/schema-candidate.sql
          psql "$SHOP_POSTGRES_TEST_URL" -v ON_ERROR_STOP=1 -f postgres/runtime-compat.sql
          psql "$SHOP_POSTGRES_TEST_URL" -v ON_ERROR_STOP=1 -c 'INSERT INTO shopeasy.asset_storage_quota(id,used_bytes,max_bytes) VALUES(1,0,67108864) ON CONFLICT (id) DO NOTHING;'
      - name: Test exact checked-out PostgreSQL source
        run: node --test postgres/legacy-query.test.mjs postgres/bridge.test.mjs postgres/settings-batcher.test.mjs postgres/backend.integration.test.mjs test/product-photo-preview-regression.test.js test/design-v15-image-resilience.test.js test/legacy-backup-backend.test.js
      - name: Native backup and restore drill with synthetic data only
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" pg_dump -U postgres -d shopeasy_ci -Fc --schema=shopeasy > "$RUNNER_TEMP/shopeasy-ci.dump"
          test -s "$RUNNER_TEMP/shopeasy-ci.dump"
          docker exec "$PG_CONTAINER" createdb -U postgres shopeasy_restore_ci
          docker exec "$PG_CONTAINER" psql -U postgres -d shopeasy_restore_ci -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA extensions; CREATE EXTENSION citext WITH SCHEMA extensions;'
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres -d shopeasy_restore_ci --exit-on-error --no-owner --no-acl < "$RUNNER_TEMP/shopeasy-ci.dump"
          for table in products categories users sessions orders order_items; do
            original=$(docker exec "$PG_CONTAINER" psql -U postgres -d shopeasy_ci -At -c "SELECT count(*) FROM shopeasy.$table")
            restored=$(docker exec "$PG_CONTAINER" psql -U postgres -d shopeasy_restore_ci -At -c "SELECT count(*) FROM shopeasy.$table")
            test "$original" = "$restored"
          done
          docker exec "$PG_CONTAINER" psql -U postgres -d shopeasy_restore_ci -At -c "SELECT count(*) FROM shopeasy.products WHERE sku='WISH-CI-001'" | grep -Fx 1
          rm -f "$RUNNER_TEMP/shopeasy-ci.dump"
