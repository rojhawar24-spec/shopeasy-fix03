name: Prepare protected Vercel preview
on:
  push:
    paths:
      - '.github/workflows/prepare-vercel-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: vercel-preview
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Resolve and pin PostgreSQL driver
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact pg@8.16.3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin PostgreSQL runtime dependency and lockfile'
            git push origin HEAD:refs/heads/vercel-preview
          fi
      - name: Syntax check and SQL adapter tests
        run: |
          node --check src/database.js
          node --check src/server.js
          node --test postgres/legacy-query.test.mjs postgres/bridge.test.mjs
