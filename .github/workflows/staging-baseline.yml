name: ShopEasy staging baseline
on:
  push:
    paths:
      - '.github/workflows/staging-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Restore original CI contract from release archive
        run: |
          python3 - <<'PY'
          import zipfile, io, pathlib
          with zipfile.ZipFile("../ShopEasy-FIX03-GitHub-Upload-Kit.zip") as outer:
              data=outer.read("ShopEasy-2.8.95-FIX03-FULL-PROJECT.zip")
          with zipfile.ZipFile(io.BytesIO(data)) as inner:
              matches=[n for n in inner.namelist() if n.endswith(".github/workflows/ci.yml")]
              assert len(matches)==1, "Original CI contract not uniquely found"
              target=pathlib.Path(".github/workflows/ci.yml")
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(inner.read(matches[0]))
              print("Original CI contract restored")
          PY
      - name: PostgreSQL compatibility unit tests
        run: node --test postgres/legacy-query.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and lint
        run: |
          npm run check
          npm run lint
          npm run typecheck:core
      - name: Regression tests with disposable local databases
        run: npm test
